name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends grub-common python3-pil
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Build every resolution
        run: python3 build.py --all --preview --out "$RUNNER_TEMP/dist"
      - name: Sanity-check output
        run: |
          set -e
          for d in "$RUNNER_TEMP"/dist/*/; do
            for f in theme.txt background.png select_c.png menu.pf2 small.pf2 icons/windows.png; do
              test -s "$d/$f" || { echo "missing $f in $d"; exit 1; }
            done
          done
          echo "all resolutions built"
      - name: Installer dry run
        run: ./install.sh --dry-run --res 1920x1080 --timeout 5
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist
